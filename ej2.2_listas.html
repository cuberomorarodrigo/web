<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas y menús</title>
</head>
<body bgcolor="#eeeeee" text="#111111">
    <h2>lista no ordenada -&gt; menú horizontal</h2>
    <table border="0" cellpadding="5" cellspacing="0" width="100%" bgcolor="#b8af96">
        <tr>
            <td width="20%" align="center" height="40"><font face="Arial" size="3" color="#ffffff">opcion1</font></td>
            <td width="20%" align="center"><font face="Arial" size="3" color="#ffffff">opcion2</font></td>
            <td width="20%" align="center"><font face="Arial" size="3" color="#ffffff">opcion3</font></td>
            <td width="20%" align="center"><font face="Arial" size="3" color="#ffffff">opcion4</font></td>
            <td width="20%" align="center"><font face="Arial" size="3" color="#ffffff">opcion5</font></td>
        </tr>
    </table>

    <hr>

    <h2>lista no ordenada -&gt; menú vertical</h2>
    <table border="0" cellpadding="10" cellspacing="0" width="150">
        <tr>
            <td bgcolor="lime" width="250" height="40"><font face="Arial" size="3" color="#ffffff">opcion1</font></td>
        </tr>
        <tr>
            <td bgcolor="lime" width="250" height="40"><font face="Arial" size="3" color="#ffffff">opcion2</font></td>
        </tr>
        <tr>
            <td bgcolor="red" width="250" height="40"><font face="Arial" size="3" color="#ffffff">opcion3</font></td>
        </tr>
        <tr>
            <td bgcolor="lime" width="250" height="40"><font face="Arial" size="3" color="#ffffff">opcion4</font></td>
        </tr>
        <tr>
            <td bgcolor="lime" width="250" height="40"><font face="Arial" size="3" color="#ffffff">opcion5</font></td>
        </tr>
    </table>
</body>
</html>
